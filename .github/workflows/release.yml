name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip publication; run the gate and npm publish --dry-run
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test
      - run: bun run build
      - name: Require declaration emit
        run: test -f dist/index.js && test -f dist/index.d.ts
      - name: Guard version and registry
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bun scripts/assert-publishable.ts --tag "${GITHUB_REF_NAME}"
          else
            bun scripts/assert-publishable.ts
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
